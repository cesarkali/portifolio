<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />
  <!-- Glowing border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.8" />
  <!-- Monogram text "J" -->
  <text x="16" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="16" fill="url(#glowGrad)" text-anchor="middle">J</text>
</svg>
